# Steliant · Portafolio servido en https://glitchgang.net/demos/
#
# Este bloque va DENTRO del server { } de glitchgang.net, antes de los demás location.
# El repositorio debe estar clonado en /var/www/steliant/demos
# (la carpeta se llama "demos" para que coincida con la URL).

location = /demos {
    return 301 /demos/;
}

# ^~ hace que ninguna otra regla de glitchgang.net se meta con /demos/
location ^~ /demos/ {
    root /var/www/steliant;
    index index.html;

    # No publicar la carpeta .git ni los archivos de instrucciones
    location ~ ^/demos/\.git {
        deny all;
    }
    location ~* \.(md|conf)$ {
        deny all;
    }

    # Archivos estáticos con caché
    location ~* \.(js|css|png|jpe?g|gif|svg|webp|avif|ico|woff2?|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Cada demo es una app independiente: si la ruta no existe (p. ej. al recargar
    # /demos/steliant-esports/torneos) se devuelve el index.html de ESA demo.
    location ~ ^/demos/(steliant-[^/]+|tour-steliant)/ {
        try_files $uri $uri/ $uri.html /demos/$1/index.html;
    }

    # Portafolio principal
    try_files $uri $uri/ /demos/index.html;
}
