# Steliant · Portafolio — bloque de Nginx
# Copiar a /etc/nginx/sites-available/steliant y cambiar tudominio.com por el dominio real.

server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;

    root /var/www/steliant-portafolio;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # No publicar la carpeta .git ni los archivos de instrucciones
    location ~ /\.git {
        deny all;
    }
    location ~* \.(md|conf)$ {
        deny all;
    }

    # Archivos estáticos con caché (va antes que /demos/ para que gane)
    location ~* \.(js|css|png|jpe?g|gif|svg|webp|avif|ico|woff2?|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Cada demo es una app independiente: si la ruta no existe (p. ej. al recargar
    # /demos/steliant-esports/torneos) se devuelve el index.html de ESA demo.
    location ~ ^/demos/(?<demo>[^/]+)/ {
        try_files $uri $uri/ $uri.html /demos/$demo/index.html;
    }

    # /demos/steliant-esports (sin barra final) → con barra
    location ~ ^/demos/[^/]+$ {
        return 301 $uri/;
    }

    # Portafolio principal
    location / {
        try_files $uri $uri/ /index.html;
    }
}
